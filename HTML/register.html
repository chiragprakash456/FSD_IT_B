<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register page</title>
    <style>
        body{
            background-color: rgb(236, 236, 124);
        }
        .box{
            background-color: aqua;
            margin-left: 500px;
            margin-right: 200px;
            border-radius: 10px;
            height: 500px;
            width: 300px;
            padding: 20px;
            word-spacing: 8px;
            justify-content: space-between;
        }
       
        
    
        #space{
            margin-bottom: 10px;
        }
        .width{
            width: 100%;
        }
        .width1{
            width: 50%;
        }
        .button{
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            gap: 5px;
            height: 25px;
        }
        #reg{
            background-color: rgb(58, 239, 2);
            cursor: pointer;
            border-radius: 4px;
            border: none;
        }
        #reset{
            background-color: red;
            cursor: pointer;
            border-radius: 4px;
            border: none;
            
        }
    </style>
</head> 
<body background = "yellow">
    <div class = "box">
        <h2> Register here </h2>
    <form method = "post" action = "register.jsp">
        <label for = "name" > Name</label> <br>
        <input type = "text" name = "uname" class = "width" placeholder="Enter user name" required id = "space"> <br>
        <label for = "name"> MObile Number</label> <br>
        <input type = "number" name = "mobile" class = "width" placeholder="Enter user mobile number" required id = "space">
       <br> <label for = "name"> Email</label> <br>
        <input type = "email" name = "email" class = "width"placeholder="Enter user emial" required id = "space"> <br>
        <label for = "dob>"></label> Date of Birth </label> <br>
        <input type = "date" name = "dob" required id = "space" class = "width"> <br>
        <label for = "name" id = "space"> Gender</label>
        <input type = "radio" name = "gender" value = "M" id = "space"> Male
        <input type = "radio" name = "gender" value = "F"> Female <br>
        <label for = "branch"> Branch</label> <br>
    <select name="branch" id = "space" class = "width">
        <option value="CSE">CSE</option>
        <option value="IT">IT</option>
        <option value="ECE">ECE</option>
        <option value="CSE-AIML">CSE-AIML</option>
        <option value="CSE-DS">CSE-DS</option>
    </select>
    <br/><label for="sem">Semester:</label>
    <select name="sem" id = "space" class = "width">
        <option value="I">I</option>
        <option value="III">III</option>
        <option value="V">V</option>
        <option value="VII">VII</option>
        
    </select>
    <BR/>
    <label for="file" id = "space">Upload 12th Marksheet</label>
    <input type="file"name="resume" id = "space" class = "width"/>
    <BR/>
    <div class = "button">
<input type="submit" value="Register" class = "width1" id = "reg"/>
<input type="reset" value="Reset"  class = "width1" id = "reset"/> </div>

    </form>
    </div>
    
</body>
</html>
